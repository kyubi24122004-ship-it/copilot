<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Spice3K</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="bg-gradient-to-br from-[#0f172a] via-[#1f2937] to-[#111827] text-slate-100 font-inter">
  <header class="p-4 max-w-6xl mx-auto flex items-center justify-between">
    <a href="/index.html" class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-gradient-to-br from-amber-400 to-rose-500 flex items-center justify-center text-black font-extrabold">S3</div><span class="font-bold">Spice3K</span></a>
    <nav class="hidden md:flex gap-6"><a href="/index.html" class="nav-link">Home</a><a href="/about.html" class="nav-link">About</a><a href="/portfolio.html" class="nav-link">Portfolio</a><a href="/services.html" class="nav-link">Services</a></nav>
  </header>

  <main class="max-w-2xl mx-auto p-8">
    <h1 class="text-4xl font-extrabold">Get in touch</h1>
    <p class="mt-4 text-slate-300">Tell me about your project. I respond quickly to spicy ideas.</p>

    <form class="mt-6 grid gap-4">
      <input class="p-3 rounded bg-white/5" placeholder="Your name" />
      <input class="p-3 rounded bg-white/5" placeholder="Email" />
      <input class="p-3 rounded bg-white/5" placeholder="Subject" />
      <textarea class="p-3 rounded bg-white/5" rows="6" placeholder="Message"></textarea>
      <div class="flex items-center justify-between">
        <div class="text-slate-400 text-sm">Or email: hello@spice3k.example</div>
        <button type="submit" class="px-5 py-3 bg-rose-500 rounded font-semibold">Send</button>
      </div>
    </form>
  </main>

  <footer class="mt-16 p-8 text-center text-slate-400">© Spice3K</footer>
</body>
</html>
